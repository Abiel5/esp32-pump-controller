; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7

; Wireless upload once OTA firmware is already flashed via USB.
; Set OTA_PASSWORD in your shell env before uploading (matches OTA_PASSWORD in include/secrets.h):
;   PowerShell: $env:OTA_PASSWORD = "your-ota-password"
;   bash:       export OTA_PASSWORD=your-ota-password
; Then: pio run -e ota -t upload
; If mDNS (.local) doesn't resolve on your network, replace upload_port with the device's IP.
[env:ota]
extends = env:adafruit_feather_esp32_v2
upload_protocol = espota
upload_port = esp32-pump-01.local
upload_flags =
	--auth=${sysenv.OTA_PASSWORD}